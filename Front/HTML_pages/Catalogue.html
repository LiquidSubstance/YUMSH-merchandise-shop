<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Каталог</title>
    <link rel = "icon" href = "../contents/logo.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=IBM+Plex+Serif:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;1,100;1,200;1,300;1,400;1,500;1,600;1,700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Playfair:ital,opsz,wght@0,5..1200,300..900;1,5..1200,300..900&family=Roboto+Condensed:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel ="stylesheet" href="../styles/catalogue.css">
</head>
<body>
<header class='header'>
    <div class='header-wrapper'>
        <img src="../contents/logo.svg" alt="logo" width="100" height="86.9" class="logo">
        <div class = "link-wrapper">
            <a href="main_page.html" class="nav-item">Главная Страница</a>
            <a href="Catalogue.html" class="nav-item">Каталог</a>
        </div>
    </div>
    <div class = "login-wrapper">
        <a id = "open-login" class="login-item">Войти</a>
        <a id = "open-signup" class="login-item">Зарегестрироваться</a>
        <a id = "account-link" class = "login-item"></a>
    </div>
    <button class="hide-header-button" onclick="hide_header()"> ^ </button>
    <hr>
</header>
<main>
    <div class = "login-window">
        <div class="login-form-wrapper">
            <div class="login-content">
                <button class = "login-close-button" onclick="close()">x</button>
                <h2>Войти</h2>
                <p>
                    Введите имя пользователя
                    <input type = "text" aria-label="Выберите имя фильтра" id="input-name" class = "constructor-input">
                </p>
                <p>
                    Введите пароль
                    <input type = "password" aria-label="Выберите признак сравнения" id="input-password" class = "constructor-input">
                </p>
                <button class = "login-button" onclick="login()">Войти</button>
            </div>
        </div>
    </div>
    <div class = "signup-window">
        <div class="login-form-wrapper">
            <div class="login-content">
                <button class = "signup-close-button" onclick="close()">x</button>
                <h2>Регистрация пользователя</h2>
                <p>
                    Введите имя пользователя
                    <input type = "text" aria-label="Выберите имя фильтра" id="signup-name" class = "constructor-input">
                </p>
                <p>
                    Введите пароль
                    <input type = "password" aria-label="Выберите признак сравнения" id="signup-password" class = "constructor-input">
                </p>
                <button class = "login-button" onclick="signup()">Зарегистрироваться</button>
            </div>
        </div>
    </div>
        <div class = "side-menu">
            <div class = "side-menu-content">
                <div class = "filter">
                    <p> Фильтры </p>
                    <div class="filter-items">
                        <div class="not-price">
                        </div>
                        <div class="price">
                            <p>По цене:</p>
                            <label for = "by-price-up"> Не более </label>
                            <input type = "text" id = "by-price-up" class = "filter-item-price" data-property = "price" data-content = "">
                            <label for = "by-price-down"> Не менее </label>
                            <input type = "text" id = "by-price-down" class = "filter-item-price" data-property = "price" data-content = "">
                        </div>
                    </div>
                    <hr>
                </div>
                <div class="function-bar">
                    <p>Сортировать по</p>
                    <select class = "sort-form" >
                        <option value="price-desc">Сначала дорогие</option>
                        <option value="price-asc">Сначала дешевые</option>
                        <option value="date-desc">Сначала новые</option>
                        <option value="date-asc">Сначала старые</option>
                        <option value="type">По типу</option>
                    </select>
                </div>
            </div>
            <button class = "hide-menu" onclick = "hide_menu()">></button>
        </div>
    </div>
    <hr>
    <div class="catalogue">

    </div>
    <footer>
        <h3> Юношеская Математическая Школа, 2025</h3>
    </footer>
    <script src = "../scripts/hide_menu.js"></script>
    <script src="../scripts/login_front.js"></script>
    <script src="../scripts/display_filters.js"></script>
    <script src="../scripts/sort.js"></script>
    <script src="../scripts/filter.js"></script>
    <script src="../scripts/display_catalogue.js"></script>
    <script src="../scripts/hide_header.js"></script>
    <script src="../scripts/load_account.js"></script>
</main>
</body>
</html>
